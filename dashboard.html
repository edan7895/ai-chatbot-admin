<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商家后台</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; background: #f5f5f5; }

  #sidebar { width: 200px; background: #1e293b; color: white; flex-shrink: 0; display: flex; flex-direction: column; }
  #sidebar h2 { padding: 16px; font-size: 16px; margin: 0; border-bottom: 1px solid #334155; }
  .nav-item { padding: 14px 16px; cursor: pointer; font-size: 14px; }
  .nav-item.active { background: #2563eb; }
  .nav-item:hover { background: #334155; }
  #logout-btn { margin-top: auto; padding: 14px 16px; cursor: pointer; font-size: 13px; color: #94a3b8; }

  #main { flex: 1; overflow-y: auto; padding: 24px; }

  #mobile-header { display: none; background: #1e293b; color: white; padding: 12px 16px; align-items: center; justify-content: space-between; }
  #hamburger { font-size: 22px; cursor: pointer; }

  @media (max-width: 768px) {
    body { flex-direction: column; }
    #sidebar { position: fixed; top: 0; left: -220px; height: 100%; z-index: 100; transition: left 0.2s; }
    #sidebar.open { left: 0; }
    #mobile-header { display: flex; }
    #main { padding: 16px; }
  }
</style>
</head>
<body>

<div id="sidebar">
  <h2 id="store-name-label">我的商家</h2>
  <div class="nav-item active" data-section="chat">聊天</div>
  <div class="nav-item" data-section="faq">FAQ 管理</div>
  <div class="nav-item" data-section="promotions">促销管理</div>
  <div class="nav-item" data-section="customers">顾客列表</div>
  <div class="nav-item" data-section="settings">设置</div>
  <div id="logout-btn">登出</div>
</div>

<div style="flex:1; display:flex; flex-direction:column;">
  <div id="mobile-header">
    <span id="hamburger">☰</span>
    <span id="mobile-title">聊天</span>
  </div>
  <div id="main">
    <p>这里之后几个 Part 会陆续把每个区块的内容加进来。</p>
  </div>
</div>

<script>
  const supabase = window.supabase.createClient(
    'https://qoemogwiylsqquykgarn.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFvZW1vZ3dpeWxzcXF1eWtnYXJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNTk3NjgsImV4cCI6MjEwNTYzNTc2OH0.D6RZY7jM0zabetpv66CWz9hOJiexY2Wyeu-Y5HOL_XQ'
  );

  const storeId = localStorage.getItem('store_id');
  if (!storeId) {
    window.location.href = 'login.html';
  }

  async function loadStoreName() {
    const { data } = await supabase.from('stores').select('store_name').eq('id', storeId).single();
    if (data) document.getElementById('store-name-label').textContent = data.store_name;
  }
  loadStoreName();

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await supabase.auth.signOut();
    localStorage.removeItem('store_id');
    window.location.href = 'login.html';
  });

  document.getElementById('hamburger').addEventListener('click', () => {
    document.getElementById('sidebar').classList.toggle('open');
  });

  document.querySelectorAll('.nav-item[data-section]').forEach((item) => {
    item.addEventListener('click', () => {
      document.querySelectorAll('.nav-item[data-section]').forEach((i) => i.classList.remove('active'));
      item.classList.add('active');
      document.getElementById('mobile-title').textContent = item.textContent.trim();
      document.getElementById('sidebar').classList.remove('open');
    });
  });
</script>
</body>
</html>
