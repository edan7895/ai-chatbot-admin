<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商家登入</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: sans-serif; background: #f5f5f5; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  .box { background: white; padding: 32px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 320px; max-width: 90vw; }
  h1 { font-size: 20px; margin-bottom: 20px; }
  input { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
  button { width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
  #error { color: #dc2626; font-size: 13px; margin-bottom: 8px; display: none; }
</style>
</head>
<body>
<div class="box">
  <h1>商家登入</h1>
  <div id="error"></div>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="密码">
  <button id="login-btn">登入</button>
</div>
<script>
  const supabase = window.supabase.createClient(
    'https://qoemogwiylsqquykgarn.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFvZW1vZ3dpeWxzcXF1eWtnYXJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNTk3NjgsImV4cCI6MjEwNTYzNTc2OH0.D6RZY7jM0zabetpv66CWz9hOJiexY2Wyeu-Y5HOL_XQ'
  );

  document.getElementById('login-btn').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('error');
    errorEl.style.display = 'none';

    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) {
      errorEl.textContent = '登入失败：' + error.message;
      errorEl.style.display = 'block';
      return;
    }

    const { data: storeUser, error: storeError } = await supabase
      .from('store_users')
      .select('store_id')
      .eq('user_id', data.user.id)
      .single();

    if (storeError || !storeUser) {
      errorEl.textContent = '这个账号还没有绑定商家，请联系管理员';
      errorEl.style.display = 'block';
      return;
    }

    localStorage.setItem('store_id', storeUser.store_id);
    window.location.href = 'dashboard.html';
  });
</script>
</body>
</html>
